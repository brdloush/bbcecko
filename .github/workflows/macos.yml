name: macOS

on:
  push:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          path: bbcecko

      - name: Install babashka, GTK4, GtkSourceView 5, icons
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install borkdude/brew/babashka gtk4 gtksourceview5 adwaita-icon-theme

      - name: Versions
        run: |
          sw_vers
          uname -m
          bb --version
          xcode-select -p
          clang++ --version
          pkg-config --modversion gtk4 gtksourceview-5 || true
          ls "$(brew --prefix)/lib" | grep -E "gtk-4|gtksourceview|gio-2" || true

      - name: Tests
        working-directory: bbcecko
        run: bb test

      - name: Smoke test with screenshots
        working-directory: bbcecko
        env:
          LANG: cs_CZ.UTF-8
        run: bb smoke "$GITHUB_WORKSPACE/shots"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: macos-screenshots
          path: shots
          if-no-files-found: warn

  # Installs the app the way a user would, through Homebrew, from a formula
  # made for this very commit. Proves the formula before it goes to the tap.
  brew-formula:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install babashka (to write the formula)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install borkdude/brew/babashka

      - name: Formula for this commit
        run: bb formula local "$RUNNER_TEMP/formula" && cat "$RUNNER_TEMP/formula/bbcecko.rb"

      # a user has no babashka, no borkdude tap and no deps caches: neither
      # may we, or a formula that fetches something at install time passes
      # here and fails on their Mac
      - name: Forget babashka, its tap and the deps caches
        run: |
          brew uninstall babashka && brew untap borkdude/brew && ! command -v bb
          rm -rf ~/.gitlibs ~/.m2 ~/.deps.clj

      - name: brew install from a local tap
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap-new --no-git local/bbcecko
          TAP="$(brew --repository)/Library/Taps/local/homebrew-bbcecko"
          cp "$RUNNER_TEMP/formula/bbcecko.rb" "$TAP/Formula/"
          brew install --verbose local/bbcecko/bbcecko

      - name: brew test
        run: brew test local/bbcecko/bbcecko

      - name: bbcecko --doctor
        run: |
          which bbcecko
          bbcecko --version
          bbcecko --doctor
